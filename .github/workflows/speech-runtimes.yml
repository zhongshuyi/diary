name: Speech runtime builds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/speech-runtimes.yml'
      - 'mobile/native/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'tools/prepare-speech-runtime.py'
      - 'tools/build-speech-runtime.ps1'
  pull_request:
    paths:
      - '.github/workflows/speech-runtimes.yml'
      - 'mobile/native/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'tools/prepare-speech-runtime.py'
      - 'tools/build-speech-runtime.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speech-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm64 ASR-only runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y cmake ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Cache pinned source and compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/offline-speech-runtime
          key: speech-android-${{ runner.os }}-ndk28c-${{ hashFiles('tools/prepare-speech-runtime.py') }}
      - name: Build and audit ASR-only libraries
        run: python3 tools/prepare-speech-runtime.py --platform android --ndk "$ANDROID_HOME/ndk/28.2.13676358" --jobs 4
      - name: Save verified native runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speech-android-arm64-asr-only
          path: mobile/native/offline-speech/android/arm64-v8a/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows x64 official no-TTS runtime
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify archive, DLLs and native API version
        run: python tools/prepare-speech-runtime.py --platform windows
      - name: Verify packaging checksums
        run: cmake -S mobile/native/offline_speech_windows/windows -B .local/offline-speech-runtime/windows-packaging-check
      - name: Save verified native runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speech-windows-x64-asr-only
          path: mobile/native/offline-speech/windows/x64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
