group = "com.ling.diary.offline_speech.android_arm64"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace "com.ling.diary.offline_speech.android_arm64"
    compileSdk = 34
    defaultConfig { minSdk = 21 }
    // Generated by tools/build-speech-runtime.ps1 or the CI preparation script.
    sourceSets { main { jniLibs.srcDirs = [new File(projectDir.canonicalFile, "../../offline-speech/android")] } }
}

def verifySpeechRuntime = tasks.register("verifySpeechRuntime") {
    doLast {
        def runtimeDirectory = new File(projectDir.canonicalFile, "../../offline-speech/android/arm64-v8a")
        def manifestFile = new File(runtimeDirectory, "build-manifest.json")
        if (!manifestFile.isFile()) {
            throw new GradleException("Missing speech runtime build manifest. Regenerate the ASR-only runtime before packaging.")
        }
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        if (manifest.tts != false || manifest.jni != false || manifest.diarization != false ||
            manifest.sherpaRevision != "11afbd009a7f8c08f4bcf2fc1b265d0df4670fbf" ||
            manifest.sourceSha256 != "0a8db6c55dd318f4a688faba85f7760b99a6c92e8ef8864479d418531bee1ac2" ||
            manifest.abi != "arm64-v8a") {
            throw new GradleException("The speech runtime is not the pinned ASR-only build.")
        }
        ["libsherpa-onnx-c-api.so", "libonnxruntime.so"].each { library ->
            def libraryFile = new File(runtimeDirectory, library)
            if (!libraryFile.isFile()) {
                throw new GradleException("Missing ASR-only runtime. Run tools/build-speech-runtime.ps1 or tools/prepare-speech-runtime.py --platform android before building.")
            }
            def expected = manifest.libraries.find { it.name == library }
            def actual = java.security.MessageDigest.getInstance("SHA-256")
                .digest(libraryFile.bytes).encodeHex().toString()
            if (expected == null || expected.bytes != libraryFile.length() || expected.sha256 != actual) {
                throw new GradleException("Speech library checksum mismatch. Regenerate the ASR-only runtime before packaging.")
            }
        }
        def allowed = ["libsherpa-onnx-c-api.so", "libonnxruntime.so"] as Set
        def unexpected = runtimeDirectory.listFiles().findAll { it.name.endsWith(".so") && !allowed.contains(it.name) }
        if (!unexpected.isEmpty()) {
            throw new GradleException("Unexpected native speech library found. Only the ASR C API and ONNX Runtime are packaged.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("JniLibFolders")) {
        task.dependsOn(verifySpeechRuntime)
    }
}

